[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-intelligence-engine"
version = "0.1.0"
description = "Automated biomedical NLP experimentation and clinical intelligence platform"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "PyYAML>=6.0",
  "joblib>=1.4",
  "mlflow>=3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
transformers = ["torch>=2.2", "transformers>=4.48", "datasets>=3.0", "accelerate>=1.0"]
app = ["torch>=2.2", "transformers>=4.48", "fastapi>=0.115", "uvicorn>=0.30", "streamlit>=1.38", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

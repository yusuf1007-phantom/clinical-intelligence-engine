experiment:
  name: pubmed-rct-baselines
  historical_macro_f1: 0.8404

data:
  processed_dir: data/processed

features:
  max_features: 60000
  ngram_min: 1
  ngram_max: 2
  min_df: 2
  sublinear_tf: true

models:
  logistic_regression:
    max_iter: 1500
    C: 2.0
  linear_svm:
    C: 1.0
  random_forest:
    n_estimators: 300
    max_depth: 40
    n_jobs: -1

training:
  seed: 42

output:
  artifact_dir: artifacts/baselines
